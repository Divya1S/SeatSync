<path d="M 975 132 L 975 830" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>
<rect x="1075.0" y="86" width="150" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>

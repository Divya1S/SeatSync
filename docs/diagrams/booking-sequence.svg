<text x="765.0" y="107.0" font-size="13" fill="#1f2937" font-weight="600" text-anchor="middle">PostgreSQL</text>
<text x="765.0" y="124.0" font-size="9.5" fill="#1f2937" text-anchor="middle">holds · seat_inventory · bookings · outbox_events</text>
<path d="M 765 132 L 765 830" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>

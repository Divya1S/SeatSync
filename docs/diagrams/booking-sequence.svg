<text x="205.0" y="164" font-size="10.5" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">POST /api/holds {eventId, seatId}</text>
<path d="M 320 200 L 545 200" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-475569)"/>
<text x="432.5" y="194" font-size="10.5" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">SET hold:{event}:{seat} NX PX 300000</text>
<rect x="55" y="218" width="545" height="174" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
<rect x="55" y="218" width="34" height="18" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="72" y="231" font-size="10.5" fill="#1f2937" font-weight="600" text-anchor="middle">alt</text>
<text x="97" y="231" font-size="10.5" fill="#64748b" font-style="italic">[key already exists]</text>
<path d="M 545 248 L 320 248" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#arrow-475569)"/>
<text x="432.5" y="242" font-size="10.5" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">nil</text>

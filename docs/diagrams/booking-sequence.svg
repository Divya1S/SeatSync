<rect width="1270" height="890" fill="#ffffff"/>
<text x="30" y="44" font-size="21" fill="#1f2937" font-weight="600">Booking flow: hold, then confirm</text>
<text x="30" y="66" font-size="12.5" fill="#64748b">Two requests, three guards. Redis absorbs contention; the hold row and the @Version update in PostgreSQL make the decision.</text>
<rect x="15.0" y="86" width="150" height="46" rx="8" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.2"/>
<text x="90.0" y="113.0" font-size="13" fill="#1f2937" font-weight="600" text-anchor="middle">User (SPA)</text>
<path d="M 90 132 L 90 830" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>
<rect x="245.0" y="86" width="150" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="320.0" y="113.0" font-size="13" fill="#1f2937" font-weight="600" text-anchor="middle">booking-service</text>
<path d="M 320 132 L 320 830" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>
<rect x="470.0" y="86" width="150" height="46" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>

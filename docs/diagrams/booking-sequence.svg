<text x="545.0" y="124.0" font-size="9.5" fill="#1f2937" text-anchor="middle">hold:{event}:{seat}</text>
<path d="M 545 132 L 545 830" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>

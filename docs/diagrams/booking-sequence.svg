<path d="M 1150 132 L 1150 830" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>
<rect x="315" y="170" width="10" height="208" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>

<text x="205.0" y="270" font-size="10.5" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">409 seat already held</text>
<path d="M 55 296 L 600 296" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>
<text x="63" y="309" font-size="10.5" fill="#64748b" font-style="italic">[claimed]</text>
<path d="M 320 324 L 765 324" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-475569)"/>
<text x="542.5" y="318" font-size="10.5" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">INSERT holds (status HELD, expires_at = now + 5 min)</text>
<path d="M 320 352 L 90 352" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#arrow-475569)"/>
<text x="205.0" y="346" font-size="10.5" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">201 {holdId, expiresAt}</text>
<path d="M 320 376 L 90 376" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#arrow-64748b)"/>
<text x="205.0" y="370" font-size="10.5" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">WS: seat HELD (relayed to all instances via Redis pub/sub)</text>
<rect x="315" y="430" width="10" height="262" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
<path d="M 90 430 L 320 430" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-475569)"/>
<text x="205.0" y="424" font-size="10.5" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">POST /api/bookings {holdId}</text>
<path d="M 320 458 L 765 458" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-475569)"/>
<text x="542.5" y="452" font-size="10.5" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">in one transaction: re-read the hold → owner = caller · status = HELD · expires_at &gt; now</text>
<path d="M 320 486 L 765 486" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-475569)"/>
<text x="542.5" y="480" font-size="10.5" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">UPDATE seat_inventory SET status = BOOKED, version = n + 1 WHERE id = ? AND version = n</text>
<rect x="55" y="504" width="765" height="204" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
<rect x="55" y="504" width="34" height="18" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="72" y="517" font-size="10.5" fill="#1f2937" font-weight="600" text-anchor="middle">alt</text>
<text x="97" y="517" font-size="10.5" fill="#64748b" font-style="italic">[version conflict]</text>
<path d="M 765 534 L 320 534" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#arrow-475569)"/>
<text x="542.5" y="528" font-size="10.5" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">OptimisticLockingFailure → rollback</text>
<path d="M 320 562 L 90 562" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#arrow-475569)"/>
<text x="205.0" y="556" font-size="10.5" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">409 seat was just taken</text>
<path d="M 55 582 L 820 582" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>
<text x="63" y="595" font-size="10.5" fill="#64748b" font-style="italic">[committed]</text>
<path d="M 320 610 L 765 610" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-475569)"/>
<text x="542.5" y="604" font-size="10.5" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">INSERT bookings · hold → CONFIRMED · INSERT outbox_events · COMMIT</text>
<path d="M 320 638 L 545 638" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-475569)"/>
<text x="432.5" y="632" font-size="10.5" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">DEL hold:{event}:{seat}</text>
<path d="M 320 666 L 90 666" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#arrow-475569)"/>
<text x="205.0" y="660" font-size="10.5" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">201 CONFIRMED {bookingId}</text>
<path d="M 320 690 L 90 690" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#arrow-64748b)"/>
<text x="205.0" y="684" font-size="10.5" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">WS: seat BOOKED</text>
<rect x="315" y="744" width="10" height="6" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
<path d="M 320 746 L 975 746" fill="none" stroke="#15803d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-15803d)"/>
<text x="647.5" y="740" font-size="10.5" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">OutboxRelay, every 2 s: claim rows FOR UPDATE SKIP LOCKED → publish BookingConfirmed → mark published_at</text>
<path d="M 975 774 L 1150 774" fill="none" stroke="#15803d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-15803d)"/>
<text x="1062.5" y="768" font-size="10.5" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">consume (at-least-once)</text>
<rect x="1000" y="790" width="260" height="40" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.2"/>
<text x="1130.0" y="809.0" font-size="10" fill="#1f2937" text-anchor="middle">claim message_id (UNIQUE) → send → SENT</text>
<text x="1130.0" y="822.0" font-size="10" fill="#1f2937" text-anchor="middle">a redelivery is a logged no-op</text>
<text x="30" y="866" font-size="11" fill="#64748b">Correctness never depends on Redis: a lost or expired key can at most let a rival reach the UPDATE, where the version check admits exactly one commit.</text>
</svg>

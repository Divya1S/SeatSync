<text x="30" y="44" font-size="21" fill="#1f2937" font-weight="600">SeatSync system architecture</text>
<text x="30" y="66" font-size="12.5" fill="#64748b">Six Spring Boot services behind a gateway, one Angular SPA, PostgreSQL, Redis and Kafka. The whole stack runs with docker compose up.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="570" viewBox="0 0 1270 570" font-family='Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<defs><marker id="arrow-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><marker id="arrow-15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/></marker></defs>
<rect width="1270" height="570" fill="#ffffff"/>
<text x="30" y="44" font-size="21" fill="#1f2937" font-weight="600">Event pipeline: transactional outbox to email</text>
<text x="30" y="66" font-size="12.5" fill="#64748b">Facts that already happened travel over Kafka. The HTTP path never touches the broker; a Kafka outage delays notifications and never loses them.</text>
<rect x="30" y="120" width="230" height="110" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="145.0" y="158.0" font-size="13" fill="#1f2937" font-weight="600" text-anchor="middle">booking-service transaction</text>
<text x="145.0" y="175.0" font-size="10.5" fill="#1f2937" text-anchor="middle">booking or hold row change</text>
<text x="145.0" y="189.0" font-size="10.5" fill="#1f2937" text-anchor="middle">+ outbox_events row</text>
<text x="145.0" y="203.0" font-size="10.5" fill="#1f2937" text-anchor="middle">one COMMIT, no dual write</text>
<rect x="300" y="120" width="240" height="110" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="420.0" y="149.0" font-size="13" fill="#1f2937" font-weight="600" text-anchor="middle">OutboxRelay</text>
<text x="420.0" y="165.0" font-size="10.5" fill="#64748b" text-anchor="middle">every 2 s, on every replica</text>
<text x="420.0" y="182.0" font-size="10.5" fill="#1f2937" text-anchor="middle">claim ≤ 100 rows FOR UPDATE SKIP LOCKED</text>
<text x="420.0" y="196.0" font-size="10.5" fill="#1f2937" text-anchor="middle">send().get() → mark published_at</text>
<text x="420.0" y="210.0" font-size="10.5" fill="#1f2937" text-anchor="middle">broker timeout → stop, retry next cycle</text>
<rect x="580" y="120" width="230" height="110" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
<text x="695.0" y="151.0" font-size="13" fill="#1f2937" font-weight="600" text-anchor="middle">Kafka</text>
<text x="695.0" y="168.0" font-size="10.5" fill="#1f2937" text-anchor="middle">seatsync.booking.confirmed</text>
<text x="695.0" y="182.0" font-size="10.5" fill="#1f2937" text-anchor="middle">seatsync.hold.expired</text>
<text x="695.0" y="196.0" font-size="10.5" fill="#1f2937" text-anchor="middle">seatsync.waitlist.offered</text>
<text x="695.0" y="210.0" font-size="10.5" fill="#1f2937" text-anchor="middle">3 partitions · key = eventId</text>
<rect x="860" y="120" width="230" height="110" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="975.0" y="158.0" font-size="13" fill="#1f2937" font-weight="600" text-anchor="middle">notification-service</text>
<text x="975.0" y="175.0" font-size="10.5" fill="#1f2937" text-anchor="middle">1. claim message_id (UNIQUE) → SENDING</text>
<text x="975.0" y="189.0" font-size="10.5" fill="#1f2937" text-anchor="middle">2. compose + send over SMTP</text>
<text x="975.0" y="203.0" font-size="10.5" fill="#1f2937" text-anchor="middle">3. SENT · duplicate delivery → no-op</text>
<rect x="1130" y="120" width="110" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="1185.0" y="165.0" font-size="13" fill="#1f2937" font-weight="600" text-anchor="middle">Mailpit</text>
<text x="1185.0" y="182.0" font-size="10.5" fill="#1f2937" text-anchor="middle">:8025</text>
<text x="1185.0" y="196.0" font-size="10.5" fill="#1f2937" text-anchor="middle">SMTP sandbox</text>
<path d="M 260 195 L 300 195" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-475569)"/>
<text x="280" y="187" font-size="10" fill="#64748b" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">poll</text>
<path d="M 540 195 L 580 195" fill="none" stroke="#15803d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-15803d)"/>
<text x="560" y="187" font-size="10" fill="#64748b" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">publish</text>
<path d="M 810 195 L 860 195" fill="none" stroke="#15803d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-15803d)"/>
<text x="835" y="187" font-size="10" fill="#64748b" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">consume</text>
<path d="M 1090 195 L 1130 195" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-475569)"/>
<text x="1110" y="187" font-size="10" fill="#64748b" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">SMTP</text>
<rect x="720" y="360" width="280" height="90" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="860.0" y="388.0" font-size="13" fill="#1f2937" font-weight="600" text-anchor="middle">retry topics</text>
<text x="860.0" y="405.0" font-size="10.5" fill="#1f2937" text-anchor="middle">&lt;topic&gt;-retry-1000 → -retry-2000 → -retry-4000</text>
<text x="860.0" y="419.0" font-size="10.5" fill="#1f2937" text-anchor="middle">4 attempts in total, exponential backoff</text>
<text x="860.0" y="433.0" font-size="10.5" fill="#1f2937" text-anchor="middle">transient failures only (SMTP, database)</text>
<rect x="1060" y="360" width="180" height="90" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.2"/>
<text x="1150.0" y="388.0" font-size="13" fill="#1f2937" font-weight="600" text-anchor="middle">&lt;topic&gt;-dlt</text>
<text x="1150.0" y="405.0" font-size="10.5" fill="#1f2937" text-anchor="middle">attempts exhausted, or</text>
<text x="1150.0" y="419.0" font-size="10.5" fill="#1f2937" text-anchor="middle">poison: unparseable JSON,</text>
<text x="1150.0" y="433.0" font-size="10.5" fill="#1f2937" text-anchor="middle">schema violation</text>
<path d="M 975 230 L 975 360" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-475569)"/>
<text x="981" y="300" font-size="10" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">transient failure</text>
<path d="M 760 360 L 760 300 L 900 300 L 900 230" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-475569)"/>
<text x="830" y="294" font-size="10" fill="#64748b" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">redeliver after the delay</text>
<path d="M 1000 405 L 1060 405" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-475569)"/>
<text x="1030" y="398" font-size="9.5" fill="#64748b" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">exhausted</text>
<path d="M 1070 230 L 1070 280 L 1150 280 L 1150 360" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-475569)"/>
<text x="1144" y="330" font-size="10" fill="#64748b" text-anchor="end" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">poison: straight to the DLT</text>
<rect x="760" y="480" width="480" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="1000.0" y="506.0" font-size="10.5" fill="#1f2937" text-anchor="middle">Runbook (docs/runbook-dlt-replay.md): inspect the DLT, fix the cause, pipe messages back</text>
<text x="1000.0" y="520.0" font-size="10.5" fill="#1f2937" text-anchor="middle">to the main topic. Replay is safe at any time because consumption is idempotent on messageId.</text>
<path d="M 1150 450 L 1150 480" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-475569)"/>
<path d="M 760 508 L 695 508 L 695 230" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#arrow-475569)"/>
<text x="689" y="380" font-size="10" fill="#64748b" text-anchor="end" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">replay</text>
</svg>

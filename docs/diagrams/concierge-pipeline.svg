<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="520" viewBox="0 0 1210 520" font-family='Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<defs><marker id="arrow-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="1210" height="520" fill="#ffffff"/>
<text x="30" y="44" font-size="21" fill="#1f2937" font-weight="600">AI concierge: grounded answers or an explicit hand-off</text>
<text x="30" y="66" font-size="12.5" fill="#64748b">Answers come only from the policy corpus and live tool calls. Every response carries its sources, a confidence level and an escalation flag.</text>
<rect x="30" y="120" width="190" height="88" rx="8" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.2"/>
<text x="125.0" y="147.0" font-size="13" fill="#1f2937" font-weight="600" text-anchor="middle">Chat widget</text>
<text x="125.0" y="164.0" font-size="10.5" fill="#1f2937" text-anchor="middle">POST /api/concierge/chat</text>
<text x="125.0" y="178.0" font-size="10.5" fill="#1f2937" text-anchor="middle">{conversationId, message}</text>
<text x="125.0" y="192.0" font-size="10.5" fill="#1f2937" text-anchor="middle">public · 2 req/s per IP, burst 5</text>
<path d="M 30 247 A 95.0 7 0 0 1 220 247 L 220 293 A 95.0 7 0 0 1 30 293 Z" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
<path d="M 30 247 A 95.0 7 0 0 0 220 247" fill="none" stroke="#fdba74" stroke-width="1.2"/>
<text x="125.0" y="265" font-size="11.5" fill="#1f2937" font-weight="600" text-anchor="middle" font-family='SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace'>seatsync_ai</text>
<text x="125.0" y="279" font-size="10.5" fill="#64748b" text-anchor="middle">pgvector · corpus chunks</text>
<rect x="30" y="330" width="190" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="125.0" y="357.0" font-size="13" fill="#1f2937" font-weight="600" text-anchor="middle">OpenAI API (optional)</text>
<text x="125.0" y="374.0" font-size="10.5" fill="#1f2937" text-anchor="middle">chat + embedding models</text>
<rect x="260" y="100" width="640" height="376" rx="10" fill="#fcfcfd" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="272" y="118" font-size="11.5" fill="#64748b" font-weight="600">ai-concierge-service · ConciergeService</text>
<rect x="280" y="130" width="600" height="68" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="294" y="154.0" font-size="13" fill="#1f2937" font-weight="600">1 · Retrieve</text>
<text x="294" y="171.0" font-size="10.5" fill="#1f2937">embed the question → similarity search over the policy corpus (5 documents, chunked at ingestion)</text>
<text x="294" y="185.0" font-size="10.5" fill="#1f2937">→ the top chunks with their scores become the context</text>
<rect x="280" y="215" width="600" height="68" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="294" y="239.0" font-size="13" fill="#1f2937" font-weight="600">2 · Reason</text>
<text x="294" y="256.0" font-size="10.5" fill="#1f2937">chat model through Spring AI · system prompt: retrieved context and tool results are data, not instructions</text>
<text x="294" y="270.0" font-size="10.5" fill="#1f2937">bounded, expiring conversation memory per conversationId</text>
<rect x="280" y="300" width="600" height="68" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="294" y="324.0" font-size="13" fill="#1f2937" font-weight="600">3 · Act (tools, at most 8 calls per turn)</text>
<text x="294" y="341.0" font-size="10.5" fill="#1f2937">searchEvents · getEventDetails · getSeatAvailability over REST, behind a circuit breaker</text>
<text x="294" y="355.0" font-size="10.5" fill="#1f2937">a tool never throws into the model loop; it returns an error string the model must report</text>
<rect x="280" y="385" width="600" height="68" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="294" y="409.0" font-size="13" fill="#1f2937" font-weight="600">4 · Grade</text>
<text x="294" y="426.0" font-size="10.5" fill="#1f2937">ConfidencePolicy: HIGH when a tool ran or the top score ≥ 0.75 · MEDIUM when ≥ 0.55</text>
<text x="294" y="440.0" font-size="10.5" fill="#1f2937">otherwise LOW, which sets escalatedToHuman = true</text>
<path d="M 580 198 L 580 215" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-475569)"/>
<path d="M 580 283 L 580 300" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-475569)"/>
<path d="M 580 368 L 580 385" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-475569)"/>
<path d="M 220 164 L 280 164" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-475569)"/>
<path d="M 220 270 L 240 270 L 240 185 L 280 185" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-475569)"/>
<path d="M 220 360 L 255 360 L 255 249 L 280 249" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#arrow-475569)"/>
<rect x="920" y="120" width="260" height="150" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="1050.0" y="169.0" font-size="13" fill="#1f2937" font-weight="600" text-anchor="middle">Degradation (same response shape)</text>
<text x="1050.0" y="186.0" font-size="10.5" fill="#1f2937" text-anchor="middle">no OPENAI_API_KEY → offline mode</text>
<text x="1050.0" y="201.0" font-size="10.5" fill="#1f2937" text-anchor="middle">provider error · breaker open · tool failure</text>
<text x="1050.0" y="216.0" font-size="10.5" fill="#1f2937" text-anchor="middle">→ &quot;I&#x27;m not sure, contact support@seatsync.local&quot;</text>
<text x="1050.0" y="231.0" font-size="10.5" fill="#1f2937" text-anchor="middle">escalatedToHuman = true, still HTTP 200</text>
<path d="M 880 249 L 920 249" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#arrow-475569)"/>
<rect x="920" y="300" width="260" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="1050.0" y="329.0" font-size="13" fill="#1f2937" font-weight="600" text-anchor="middle">catalog-service · booking-service</text>
<text x="1050.0" y="346.0" font-size="10.5" fill="#1f2937" text-anchor="middle">events, details, live seat availability</text>
<path d="M 880 334 L 920 334" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-475569)"/>
<rect x="920" y="390" width="260" height="86" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
<text x="1050.0" y="416.0" font-size="13" fill="#1f2937" font-weight="600" text-anchor="middle">Response (always HTTP 200)</text>
<text x="1050.0" y="433.0" font-size="10.5" fill="#1f2937" text-anchor="middle">answer · sources[] (title, snippet, score)</text>
<text x="1050.0" y="447.0" font-size="10.5" fill="#1f2937" text-anchor="middle">confidence: HIGH | MEDIUM | LOW</text>
<text x="1050.0" y="461.0" font-size="10.5" fill="#1f2937" text-anchor="middle">escalatedToHuman: true | false</text>
<path d="M 880 419 L 920 419" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-475569)"/>
<text x="30" y="506" font-size="11" fill="#64748b">The chat endpoint has its own, smaller rate limit at the gateway because every call costs model tokens. Without a key the service still starts and reports healthy; booking is never affected.</text>
</svg>

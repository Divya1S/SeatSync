<text x="557" y="568" font-size="9.5" fill="#64748b" text-anchor="middle" font-family='SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace'>SELECT event_id, seat_id FROM bookings WHERE status = &#x27;CONFIRMED&#x27; GROUP BY event_id, seat_id HAVING count(*) &gt; 1  →  0 rows</text>
